[project]
name = "sam2-memory-research"
version = "0.0.1"
description = "SAM 2.1 pose+time memory selection research — VKITTI2 data pipeline (Milestone 0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkitti", "src/memsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs data/vkitti2 Scene01/clone (skipped if absent)"]
