[project]
name = "sam2-memory-research"
version = "0.0.1"
description = "SAM 2.1 pose+time memory selection research — VKITTI2 data pipeline (Milestone 0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]
# Official SAM 2 (M2+), pinned to an exact upstream commit; installed as a package, not vendored.
sam2 = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]

[tool.uv]
default-groups = ["dev", "sam2"]
# No CUDA on this Mac: skip the optional connected-components CUDA extension instead of a failed build.
extra-build-variables = { sam-2 = { SAM2_BUILD_CUDA = "0" } }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkitti", "src/memsel", "src/baseline", "src/rfeas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs data/vkitti2 Scene01/clone (skipped if absent)"]
